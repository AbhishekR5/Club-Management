[options]

;=========================
; Database
;=========================

db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

;=========================
; Addons
;=========================

addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

;=========================
; Admin
;=========================

admin_passwd = admin

;=========================
; Data
;=========================

data_dir = /var/lib/odoo

;=========================
; Logs
;=========================

logfile = /var/log/odoo/odoo.log
log_level = info

;=========================
; Network
;=========================

xmlrpc_port = 8069
proxy_mode = False

;=========================
; Performance
;=========================

workers = 0
max_cron_threads = 2

limit_time_cpu = 120
limit_time_real = 240

limit_memory_soft = 2147483648
limit_memory_hard = 2684354560

without_demo = all

list_db = True